name = "tests-rp235x"
target = "thumbv8m.main-none-eabihf"
board = "pi-pico-2"
chip = "../../chips/rp235x"
memory = "memory-pico-2.toml"
stacksize = 2048

[kernel]
name = "tests-rp235x"
requires = {flash = 32768, ram = 8192}

[tasks.runner]
name = "test-runner"
priority = 0
max-sizes = {flash = 16384, ram = 4096}
start = true

[tasks.suite]
name = "test-suite"
priority = 2
max-sizes = {flash = 65536, ram = 4096}
start = true
stacksize = 2048
task-slots = ["assist", "idol", "suite", "runner"]
uses = ["spi0"]
notifications = ["test-irq"]
interrupts = {"spi0.irq" = "test-irq"}

[tasks.suite.config]
foo = '"Hello, world"'
bar = 42
baz = [1, 2, 3, 4]
tup = [[1, true], [2, true], [3, false]]

[tasks.assist]
name = "test-assist"
priority = 1
max-sizes = {flash = 16384, ram = 4096}
start = true

[tasks.idol]
name = "test-idol-server"
priority = 1
max-sizes = {flash = 4096, ram = 1024}
stacksize = 1024
start = true

[tasks.hiffy]
name = "task-hiffy"
priority = 3
features = ["testsuite"]
max-sizes = {flash = 32768, ram = 16384}
stacksize = 2048
start = true
task-slots = ["suite", "runner"]
notifications = ["timer"]

[tasks.idle]
name = "task-idle"
priority = 4
max-sizes = {flash = 256, ram = 256}
stacksize = 256
start = true
