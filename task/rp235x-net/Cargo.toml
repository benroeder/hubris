[package]
name = "task-rp235x-net"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { workspace = true }
idol-runtime = { workspace = true }
num-traits = { workspace = true }
zerocopy = { workspace = true }
zerocopy-derive = { workspace = true }
rp235x-pac = { workspace = true }
# The workspace alias is embedded-hal 0.2; the w5500 core uses the
# 1.0 traits (SpiDevice / OutputPin / DelayNs).
embedded-hal = { version = "1.0", default-features = false }
# Workspace smoltcp enables ipv6/udp; this task additionally needs IPv4 (which
# also gives ICMP echo replies at the interface level -- ping "just works")
# and the DHCPv4 client socket. Features are additive per crate.
smoltcp = { workspace = true, features = ["proto-ipv4", "socket-dhcpv4", "socket-tcp"] }

w5500 = { path = "../../lib/w5500" }
ringbuf = { path = "../../lib/ringbuf" }
task-rp235x-net-api = { path = "../rp235x-net-api" }
drv-rp235x-flash-api = { path = "../../drv/rp235x-flash-api" }
drv-rp235x-sys-api = { path = "../../drv/rp235x-sys-api" }
userlib = { path = "../../sys/userlib" }

[build-dependencies]
idol = { workspace = true }
build-util = { path = "../../build/util" }

[[bin]]
name = "task-rp235x-net"
test = false
doctest = false
bench = false

[lints]
workspace = true
