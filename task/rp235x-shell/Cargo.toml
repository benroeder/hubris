[package]
name = "task-rp235x-shell"
version = "0.1.0"
edition = "2021"

[dependencies]
userlib = { path = "../../sys/userlib" }
task-rp235x-usb-api = { path = "../rp235x-usb-api" }
drv-rp235x-gpio-api = { path = "../../drv/rp235x-gpio-api" }
drv-rp235x-uart-api = { path = "../../drv/rp235x-uart-api" }
drv-rp235x-spi-api = { path = "../../drv/rp235x-spi-api", optional = true }
task-rp235x-net-api = { path = "../rp235x-net-api", optional = true }
drv-rp235x-i2c-api = { path = "../../drv/rp235x-i2c-api" }
drv-rp235x-flash-api = { path = "../../drv/rp235x-flash-api" }
drv-rp235x-mailbox-api = { path = "../../drv/rp235x-mailbox-api", optional = true }
drv-rp235x-adc-api = { path = "../../drv/rp235x-adc-api" }
drv-rp235x-pwm-api = { path = "../../drv/rp235x-pwm-api" }
drv-rp235x-cyw43-api = { path = "../../drv/rp235x-cyw43-api", optional = true }
drv-rp235x-slink-api = { path = "../../drv/rp235x-slink-api", optional = true }
drv-rp235x-ws2812-api = { path = "../../drv/rp235x-ws2812-api", optional = true }
drv-rp235x-ds1302-api = { path = "../../drv/rp235x-ds1302-api", optional = true }
drv-rp235x-sdcard-api = { path = "../../drv/rp235x-sdcard-api", optional = true }
embedded-sdmmc = { workspace = true, optional = true }

[features]
# The generic SPI0 bus commands (spi xfer/role/...); off in images where a
# dedicated task (e.g. ethernet) owns SPI0 instead of drv-rp235x-spi.
spibus = ["dep:drv-rp235x-spi-api"]
# Ethernet status via the rp235x-net task (ENC28J60 + smoltcp).
eth = ["dep:task-rp235x-net-api"]
cyw43 = ["dep:drv-rp235x-cyw43-api"]
mailbox = ["dep:drv-rp235x-mailbox-api"]
slink = ["dep:drv-rp235x-slink-api"]
ws2812 = ["dep:drv-rp235x-ws2812-api"]
ds1302 = ["dep:drv-rp235x-ds1302-api"]
sdcard = ["dep:drv-rp235x-sdcard-api"]
fat = ["sdcard", "dep:embedded-sdmmc"]
datalog = ["fat", "ds1302", "ws2812"]

[[bin]]
name = "task-rp235x-shell"
test = false
doctest = false
bench = false

[lints]
workspace = true
