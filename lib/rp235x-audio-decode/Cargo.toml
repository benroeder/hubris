[package]
name = "rp235x-audio-decode"
version = "0.1.0"
edition = "2024"

# Streaming audio decoders (WAV always; MP3 via nanomp3) behind a Decoder trait,
# decoupled from the pwm task so the SAME no_std/no_alloc code can be exercised
# on the host (see tools/audio-decode-host) as well as on the device.

[features]
default = []
# MP3 decode via the pure-Rust no_std nanomp3 crate.
mp3 = ["dep:nanomp3"]

[dependencies]
nanomp3 = { version = "0.1", optional = true }

[lib]
test = false
doctest = false
bench = false

[lints]
workspace = true
