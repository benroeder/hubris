name = "demo-pi-pico-2-core1"
target = "thumbv8m.main-none-eabihf"
chip = "../../chips/rp235x"
board = "pi-pico-2"
memory = "memory-pico-2-core1.toml"
stacksize = 512

[kernel]
name = "demo-pi-pico-2-core1"
requires = {flash = 20000, ram = 4096}
stacksize = 640

[tasks.jefe]
name = "task-jefe"
priority = 0
max-sizes = {flash = 4096, ram = 1024}
start = true
stacksize = 512
notifications = ["fault", "timer"]

[tasks.beat]
name = "task-rp235x-core1-beat"
priority = 1
max-sizes = {flash = 2048, ram = 512}
stacksize = 384
start = true
extern-regions = ["shared"]

[tasks.fifo]
name = "task-rp235x-core1-fifo"
priority = 2
max-sizes = {flash = 4096, ram = 1024}
stacksize = 512
uses = ["sio"]
extern-regions = ["shared_buf"]
start = true

[tasks.idle]
name = "task-idle"
priority = 3
max-sizes = {flash = 128, ram = 256}
stacksize = 256
start = true
