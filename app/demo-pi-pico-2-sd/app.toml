name = "demo-pi-pico-2-sd"
target = "thumbv8m.main-none-eabihf"
chip = "../../chips/rp235x"
board = "pi-pico-2"
memory = "memory-pico-2-single.toml"
stacksize = 944

[kernel]
name = "demo-pi-pico-2-sd"
requires = {flash = 32768, ram = 12800}
stacksize = 8192

[tasks.jefe]
name = "task-jefe"
priority = 0
max-sizes = {flash = 4096, ram = 2048}
start = true
stacksize = 1024
notifications = ["fault", "timer"]

[tasks.usb]
name = "task-rp235x-usb"
priority = 3
max-sizes = {flash = 32768, ram = 8192}
stacksize = 4096
uses = ["usbctrl", "usb_dpram", "resets", "watchdog"]
start = true
notifications = ["usb-irq"]
interrupts = {"usbctrl.irq" = "usb-irq"}

[tasks.sys]
name = "drv-rp235x-sys"
priority = 1
max-sizes = {flash = 8192, ram = 1024}
stacksize = 512
uses = ["resets"]
start = true

[tasks.gpio_driver]
name = "drv-rp235x-gpio"
priority = 2
max-sizes = {flash = 8192, ram = 2048}
stacksize = 1024
uses = ["io_bank0", "pads_bank0", "sio"]
start = true
task-slots = ["sys"]

[tasks.uart_driver]
name = "drv-rp235x-uart"
priority = 2
max-sizes = {flash = 8192, ram = 2048}
stacksize = 1024
uses = ["uart0"]
start = true
notifications = ["uart-irq"]
interrupts = {"uart0.irq" = "uart-irq"}

# Ethernet (W5500 on SPI0) removed from this image: the I2S/PCM5102A audio build
# does not need it, and dropping the W5500's ~130 mA load frees the 3V3 rail for
# the DAC. The net task + lib/w5500 remain in-tree for other apps.

[tasks.i2c_driver]
name = "drv-rp235x-i2c"
priority = 2
max-sizes = {flash = 8192, ram = 2048}
stacksize = 1536
uses = ["i2c0"]
start = true
task-slots = ["sys"]
notifications = ["i2c-irq"]
interrupts = {"i2c0.irq" = "i2c-irq"}

[tasks.adc_driver]
name = "drv-rp235x-adc"
priority = 2
max-sizes = {flash = 8192, ram = 1024}
stacksize = 768
uses = ["adc"]
start = true
task-slots = ["sys"]

# pwm_driver removed: on the MusicPi its jack/buzzer pins are the SD card's
# SPI bus, and the I2S DAC replaced it. Freed 34K of the data pool for the
# mixer capture rings.

[tasks.i2s]
name = "drv-rp235x-i2s"
priority = 4
# Player-sized: the FLAC/MP3 decoders live on this task's stack for the whole
# blocking play op (same budget the pwm player used). sdcard (prio 2) must be
# strictly higher priority than this client (4).
max-sizes = {flash = 98304, ram = 196608}
stacksize = 53248
# Pin muxing goes through the gpio task (IPC): memories + uses + caboose must
# fit the MPU's 7 usable regions, and pio0+pio1+dma+sio is already four.
uses = ["pio0", "pio1", "dma", "sio"]
start = true
# simadc: PIO1 fake I2S ADCs drive the capture pins so the whole receive path
# runs with zero wires until the real PCM1802 boards arrive.
features = ["sdcard", "simadc"]
task-slots = ["sdcard", {gpio = "gpio_driver"}]
notifications = ["timer"]

# MusicPi WS2812 RGB pixel on GP26, sharing PIO0 with the i2s task (SM1,
# instruction slots 8..11 -- the "musicpi" feature selects pin/SM/base).
[tasks.ws2812]
name = "drv-rp235x-ws2812"
priority = 3
max-sizes = {flash = 8192, ram = 1024}
stacksize = 512
uses = ["pio0", "io_bank0", "pads_bank0", "sio"]
start = true
features = ["musicpi"]

[tasks.flash_driver]
name = "drv-rp235x-flash"
priority = 2
max-sizes = {flash = 8192, ram = 2048}
stacksize = 1024
uses = ["watchdog", "psm", "qmi"]
start = true
extern-regions = ["rom", "xip"]

# MusicPi TF slot: SPI0 on GP16-19 (the "musicpi" feature selects block+pins).
# This frees SPI1 + GP10-13 for the I2S clocks (GP10/11) and the TFT (GP12/13).
[tasks.sdcard]
name = "drv-rp235x-sdcard"
priority = 2
max-sizes = {flash = 8192, ram = 2048}
stacksize = 1024
uses = ["spi0", "io_bank0", "pads_bank0", "sio"]
start = true
features = ["musicpi"]
task-slots = ["sys"]

# ds1302 removed on the MusicPi: it bit-banged GP6-8, which are the TFT's
# D/C and backlight pins here. The driver stays in-tree for the RTC apps.

# MusicPi 1.14" TFT (ST7789V) on SPI1: CLK=GP14, MOSI=GP15, D/C=GP6, CS=GP13,
# RST=GP12, backlight=GP7. See docs/musicpi-research/musicpi.md.
[tasks.tft]
name = "drv-rp235x-st7789"
priority = 3
max-sizes = {flash = 32768, ram = 4096}
stacksize = 1536
uses = ["spi1", "io_bank0", "pads_bank0", "sio"]
start = true
task-slots = ["sys"]

[tasks.shell]
name = "task-rp235x-shell"
priority = 5
max-sizes = {flash = 65536, ram = 16384}
stacksize = 8192
start = true
features = ["sdcard", "fat", "i2s", "ws2812", "tft"]
task-slots = ["usb", "gpio_driver", "uart_driver", "i2c_driver", "flash_driver", "adc_driver", "sdcard", "i2s", "ws2812", "tft"]

[tasks.idle]
name = "task-idle"
priority = 6
max-sizes = {flash = 128, ram = 256}
stacksize = 256
start = true
