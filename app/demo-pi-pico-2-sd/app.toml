name = "demo-pi-pico-2-sd"
target = "thumbv8m.main-none-eabihf"
chip = "../../chips/rp235x"
board = "pi-pico-2"
memory = "memory-pico-2-single.toml"
stacksize = 944

[kernel]
name = "demo-pi-pico-2-sd"
requires = {flash = 32768, ram = 12288}
stacksize = 8192

[tasks.jefe]
name = "task-jefe"
priority = 0
max-sizes = {flash = 4096, ram = 2048}
start = true
stacksize = 1024
notifications = ["fault", "timer"]

[tasks.usb]
name = "task-rp235x-usb"
priority = 3
max-sizes = {flash = 32768, ram = 8192}
stacksize = 4096
uses = ["usbctrl", "usb_dpram", "resets", "watchdog"]
start = true
notifications = ["usb-irq"]
interrupts = {"usbctrl.irq" = "usb-irq"}

[tasks.sys]
name = "drv-rp235x-sys"
priority = 1
max-sizes = {flash = 8192, ram = 1024}
stacksize = 512
uses = ["resets"]
start = true

[tasks.gpio_driver]
name = "drv-rp235x-gpio"
priority = 2
max-sizes = {flash = 8192, ram = 2048}
stacksize = 1024
uses = ["io_bank0", "pads_bank0", "sio"]
start = true
task-slots = ["sys"]

[tasks.uart_driver]
name = "drv-rp235x-uart"
priority = 2
max-sizes = {flash = 8192, ram = 2048}
stacksize = 1024
uses = ["uart0"]
start = true
notifications = ["uart-irq"]
interrupts = {"uart0.irq" = "uart-irq"}

# Ethernet: ENC28J60 on SPI0 (owned directly, sdcard-style) + smoltcp + DHCP.
# Replaces the generic spi_driver in this image -- both would own SPI0.
[tasks.net]
name = "task-rp235x-net"
# Priority 4: BELOW usb (3) so the constant poll cadence cannot preempt the
# console's TX path (a same-priority net task exposed a usb TX corruption
# race), and above the shell (5), which calls us.
priority = 4
max-sizes = {flash = 131072, ram = 49152}
# 24 KiB stack: smoltcp's poll + DHCP fit comfortably, and trimming from 32 KiB
# frees pool headroom (this image runs the SRAM at ~99%; the audio task needs
# every spare byte).
stacksize = 24576
uses = ["spi0", "io_bank0", "pads_bank0", "sio"]
start = true
task-slots = ["sys"]
notifications = ["timer"]

[tasks.i2c_driver]
name = "drv-rp235x-i2c"
priority = 2
max-sizes = {flash = 8192, ram = 2048}
stacksize = 1536
uses = ["i2c0"]
start = true
task-slots = ["sys"]
notifications = ["i2c-irq"]
interrupts = {"i2c0.irq" = "i2c-irq"}

[tasks.adc_driver]
name = "drv-rp235x-adc"
priority = 2
max-sizes = {flash = 8192, ram = 1024}
stacksize = 768
uses = ["adc"]
start = true
task-slots = ["sys"]

[tasks.pwm_driver]
name = "drv-rp235x-pwm"
priority = 3
max-sizes = {flash = 65536, ram = 204800}
stacksize = 163840
uses = ["pwm", "dma", "adc"]
start = true
features = ["sdcard"]
# pwm_driver calls sdcard for `play_file`, so sdcard must be a strictly higher
# priority (lower number) than pwm_driver to avoid a priority inversion. It also
# calls gpio_driver to read the mixer buttons (GP20/GP21) during `play_mix`;
# gpio_driver at priority 2 is likewise strictly higher than pwm_driver (3).
task-slots = ["sys", "sdcard", {gpio = "gpio_driver"}]

[tasks.flash_driver]
name = "drv-rp235x-flash"
priority = 2
max-sizes = {flash = 8192, ram = 2048}
stacksize = 1024
uses = ["watchdog", "psm", "qmi"]
start = true
extern-regions = ["rom", "xip"]

[tasks.sdcard]
name = "drv-rp235x-sdcard"
priority = 2
max-sizes = {flash = 8192, ram = 2048}
stacksize = 1024
uses = ["spi1", "io_bank0", "pads_bank0", "sio"]
start = true
task-slots = ["sys"]

[tasks.ds1302]
name = "drv-rp235x-ds1302"
priority = 3
max-sizes = {flash = 8192, ram = 2048}
stacksize = 512
uses = ["sio", "io_bank0", "pads_bank0"]
start = true
# The DS1302 driver talks straight to SIO/IO_BANK0/PADS_BANK0; no task-slots.

[tasks.shell]
name = "task-rp235x-shell"
priority = 5
max-sizes = {flash = 65536, ram = 16384}
stacksize = 8192
start = true
features = ["sdcard", "fat", "ds1302", "eth"]
task-slots = ["usb", "gpio_driver", "uart_driver", "i2c_driver", "flash_driver", "adc_driver", "pwm_driver", "sdcard", "ds1302", "net"]

[tasks.idle]
name = "task-idle"
priority = 6
max-sizes = {flash = 128, ram = 256}
stacksize = 256
start = true
