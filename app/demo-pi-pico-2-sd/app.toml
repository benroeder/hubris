name = "demo-pi-pico-2-sd"
target = "thumbv8m.main-none-eabihf"
chip = "../../chips/rp235x"
board = "pi-pico-2"
memory = "memory-pico-2-single.toml"
stacksize = 944

[kernel]
name = "demo-pi-pico-2-sd"
requires = {flash = 32768, ram = 12288}
stacksize = 8192

[tasks.jefe]
name = "task-jefe"
priority = 0
max-sizes = {flash = 4096, ram = 2048}
start = true
stacksize = 1024
notifications = ["fault", "timer"]

[tasks.usb]
name = "task-rp235x-usb"
priority = 3
max-sizes = {flash = 32768, ram = 8192}
stacksize = 4096
uses = ["usbctrl", "usb_dpram", "resets", "watchdog"]
start = true
notifications = ["usb-irq"]
interrupts = {"usbctrl.irq" = "usb-irq"}

[tasks.sys]
name = "drv-rp235x-sys"
priority = 1
max-sizes = {flash = 8192, ram = 1024}
stacksize = 512
uses = ["resets"]
start = true

[tasks.gpio_driver]
name = "drv-rp235x-gpio"
priority = 2
max-sizes = {flash = 8192, ram = 2048}
stacksize = 1024
uses = ["io_bank0", "pads_bank0", "sio"]
start = true
task-slots = ["sys"]

[tasks.uart_driver]
name = "drv-rp235x-uart"
priority = 2
max-sizes = {flash = 8192, ram = 2048}
stacksize = 1024
uses = ["uart0"]
start = true
notifications = ["uart-irq"]
interrupts = {"uart0.irq" = "uart-irq"}

# Ethernet (W5500 on SPI0) removed from this image: the I2S/PCM5102A audio build
# does not need it, and dropping the W5500's ~130 mA load frees the 3V3 rail for
# the DAC. The net task + lib/w5500 remain in-tree for other apps.

[tasks.i2c_driver]
name = "drv-rp235x-i2c"
priority = 2
max-sizes = {flash = 8192, ram = 2048}
stacksize = 1536
uses = ["i2c0"]
start = true
task-slots = ["sys"]
notifications = ["i2c-irq"]
interrupts = {"i2c0.irq" = "i2c-irq"}

[tasks.adc_driver]
name = "drv-rp235x-adc"
priority = 2
max-sizes = {flash = 8192, ram = 1024}
stacksize = 768
uses = ["adc"]
start = true
task-slots = ["sys"]

[tasks.pwm_driver]
name = "drv-rp235x-pwm"
priority = 3
max-sizes = {flash = 65536, ram = 204800}
stacksize = 163840
uses = ["pwm", "dma", "adc"]
start = true
features = ["sdcard"]
# pwm_driver calls sdcard for `play_file`, so sdcard must be a strictly higher
# priority (lower number) than pwm_driver to avoid a priority inversion. It also
# calls gpio_driver to read the mixer buttons (GP20/GP21) during `play_mix`;
# gpio_driver at priority 2 is likewise strictly higher than pwm_driver (3).
task-slots = ["sys", "sdcard", {gpio = "gpio_driver"}]

# I2S audio out via PIO0 + DMA (SB Components MusicPi HAT: PCM5100A DAC +
# PAM8908 amp). BCK=GP10, LRCK=GP11, DIN=GP9, XSMT=GP22 (SIO, high = unmute),
# amp gain GP20/21. Auto-plays a boot tone. NOTE: GP10/11 collide with the
# sdcard task's SPI1 pins -- i2s starts later and re-muxes them to PIO, so SD
# commands are broken on the MusicPi until SD moves to its SPI0 (GP16-19).
# See docs/pcm5102a-research (PCM510xA family datasheet).
[tasks.i2s]
name = "drv-rp235x-i2s"
priority = 4
max-sizes = {flash = 32768, ram = 24576}
stacksize = 2048
uses = ["pio0", "dma", "io_bank0", "pads_bank0", "sio"]
start = true

# MusicPi WS2812 RGB pixel on GP26, sharing PIO0 with the i2s task (SM1,
# instruction slots 8..11 -- the "musicpi" feature selects pin/SM/base).
[tasks.ws2812]
name = "drv-rp235x-ws2812"
priority = 3
max-sizes = {flash = 8192, ram = 1024}
stacksize = 512
uses = ["pio0", "io_bank0", "pads_bank0", "sio"]
start = true
features = ["musicpi"]

[tasks.flash_driver]
name = "drv-rp235x-flash"
priority = 2
max-sizes = {flash = 8192, ram = 2048}
stacksize = 1024
uses = ["watchdog", "psm", "qmi"]
start = true
extern-regions = ["rom", "xip"]

# MusicPi TF slot: SPI0 on GP16-19 (the "musicpi" feature selects block+pins).
# This frees SPI1 + GP10-13 for the I2S clocks (GP10/11) and the TFT (GP12/13).
[tasks.sdcard]
name = "drv-rp235x-sdcard"
priority = 2
max-sizes = {flash = 8192, ram = 2048}
stacksize = 1024
uses = ["spi0", "io_bank0", "pads_bank0", "sio"]
start = true
features = ["musicpi"]
task-slots = ["sys"]

[tasks.ds1302]
name = "drv-rp235x-ds1302"
priority = 3
max-sizes = {flash = 8192, ram = 2048}
stacksize = 512
uses = ["sio", "io_bank0", "pads_bank0"]
start = true
# The DS1302 driver talks straight to SIO/IO_BANK0/PADS_BANK0; no task-slots.

[tasks.shell]
name = "task-rp235x-shell"
priority = 5
max-sizes = {flash = 65536, ram = 16384}
stacksize = 8192
start = true
features = ["sdcard", "fat", "ds1302", "i2s", "ws2812"]
task-slots = ["usb", "gpio_driver", "uart_driver", "i2c_driver", "flash_driver", "adc_driver", "pwm_driver", "sdcard", "ds1302", "i2s", "ws2812"]

[tasks.idle]
name = "task-idle"
priority = 6
max-sizes = {flash = 128, ram = 256}
stacksize = 256
start = true
