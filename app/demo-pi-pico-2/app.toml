name = "demo-pi-pico-2"
target = "thumbv8m.main-none-eabihf"
chip = "../../chips/rp235x"
board = "pi-pico-2"
memory = "memory-pico-2.toml"
stacksize = 944

[kernel]
name = "demo-pi-pico-2"
requires = {flash = 20000, ram = 4096}
stacksize = 640

[tasks.jefe]
name = "task-jefe"
priority = 0
max-sizes = {flash = 4096, ram = 512}
start = true
stacksize = 352
notifications = ["fault", "timer"]

[tasks.usb]
name = "task-rp235x-usb"
priority = 3
max-sizes = {flash = 32768, ram = 8192}
stacksize = 4096
uses = ["usbctrl", "usb_dpram", "resets"]
start = true
notifications = ["usb-irq"]
interrupts = {"usbctrl.irq" = "usb-irq"}

[tasks.sys]
name = "drv-rp235x-sys"
priority = 1
max-sizes = {flash = 8192, ram = 1024}
stacksize = 512
uses = ["resets"]
start = true

[tasks.gpio_driver]
name = "drv-rp235x-gpio"
priority = 2
max-sizes = {flash = 8192, ram = 2048}
stacksize = 1024
uses = ["io_bank0", "pads_bank0", "sio"]
start = true
task-slots = ["sys"]

[tasks.uart_driver]
name = "drv-rp235x-uart"
priority = 2
max-sizes = {flash = 8192, ram = 2048}
stacksize = 1024
uses = ["uart0"]
start = true
notifications = ["uart-irq"]
interrupts = {"uart0.irq" = "uart-irq"}

[tasks.logdemo]
name = "task-rp235x-logdemo"
priority = 4
max-sizes = {flash = 4096, ram = 1024}
stacksize = 512
start = true
task-slots = ["usb", "gpio_driver", "uart_driver"]

[tasks.idle]
name = "task-idle"
priority = 5
max-sizes = {flash = 128, ram = 256}
stacksize = 256
start = true
