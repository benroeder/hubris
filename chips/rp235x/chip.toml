# RP235x (RP2350) peripheral definitions.
# Addresses/IRQs verified against the datasheet Table 8/95 AND the official SVD
# (see docs/rp2350-research/{addresses.md,verify.py}). Minimal set for jefe+idle
# bring-up; grow per driver in later phases.

[resets]
address = 0x4002_0000  # RESETS_BASE
size = 32

[sio]
address = 0xd000_0000  # SIO (core-local), inter-core FIFO / spinlocks
size = 512

[io_bank0]
address = 0x4002_8000  # GPIO function-select
size = 0x1000
interrupts = { irq = 21 }  # IO_IRQ_BANK0

[pads_bank0]
address = 0x4003_8000  # GPIO pad control (drive/pull/isolation)
size = 0x1000

[uart0]
address = 0x4007_0000  # PL011
size = 0x1000
interrupts = { irq = 33 }  # UART0_IRQ

[spi0]
address = 0x4008_0000  # PL022 SPI0
size = 0x1000
interrupts = { irq = 31 }  # SPI0_IRQ

[spi1]
address = 0x4008_8000  # PL022 SPI1
size = 0x1000
interrupts = { irq = 32 }  # SPI1_IRQ

[i2c0]
address = 0x4009_0000  # DW_apb_i2c I2C0
size = 0x1000
interrupts = { irq = 36 }  # I2C0_IRQ

[adc]
address = 0x400a_0000  # ADC + temperature sensor
size = 0x1000

[pwm]
address = 0x400a_8000  # PWM (12 slices)
size = 0x1000

[dma]
address = 0x5000_0000  # DMA controller (16 channels; PWM-wrap-paced audio)
size = 0x1000

[qmi]
address = 0x400d_0000  # QSPI memory interface (direct mode for erase/program)
size = 0x1000

[pio0]
address = 0x5020_0000  # PIO block 0 (WS2812/NeoPixel on GP22, funcsel 6)
size = 0x1000

[pio1]
address = 0x5030_0000  # PIO block 1 (I2S capture + simadc fake ADCs, funcsel 7)
size = 0x1000

[pio2]
address = 0x5040_0000  # PIO block 2 (gSPI PHY for the CYW43439 Wi-Fi, funcsel 8)
size = 0x1000

[psm]
address = 0x4001_8000  # power-on state machine (WDSEL: what a watchdog reset resets)
size = 0x1000

[watchdog]
address = 0x400d_8000  # watchdog (scratch regs + trigger; used by ROM reboot)
size = 0x1000

[ticks]
address = 0x4010_8000  # tick generators (watchdog tick; used by ROM reboot)
size = 0x1000

[powman]
address = 0x4010_0000  # power manager (boot-vector scratch; used by ROM BOOTSEL reboot)
size = 0x1000

[usbctrl]
address = 0x5011_0000  # USB device-controller registers (USB)
size = 0x1000
interrupts = { irq = 14 }  # USBCTRL_IRQ

[usb_dpram]
address = 0x5010_0000  # USB dual-port RAM (endpoint control + buffers)
size = 0x1000
