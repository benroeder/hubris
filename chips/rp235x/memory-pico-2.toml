# RAM image: the whole Hubris image (kernel + tasks) is linked at and runs
# from SRAM. The boot ROM copies it out of QSPI flash at boot, directed by the
# LOAD_MAP item in the app's IMAGE_DEF block (datasheet sec 5.1.10 "packaged
# binaries"). Nothing executes from flash at runtime, which removes the XIP
# hazard entirely: flash can be erased/programmed while the system runs.
#
# The "flash" pool below is therefore an SRAM range (code, read+execute); it
# must stay inside the 256 KiB window the LOAD_MAP copies (storage
# 0x10000000..0x10040000 -> runtime 0x20000000..0x20040000).
[[flash]]
address = 0x2000_0000
size = 0x4_0000        # 256 KiB code window (of 520 KiB total SRAM)
read = true
execute = true

[[ram]]
address = 0x2004_0000  # data pool: the rest of SRAM (striped SRAM0-7 + SRAM8/9)
size = 0x4_2000
read = true
write = true
execute = false

# Extern regions (granted to specific tasks via `extern-regions`; never
# allocated from):

# The 32 kB boot ROM (datasheet 2.2.1) -- lets the flash driver call the
# bootrom flash API (sec 5.4.8). Executable because ROM functions run at the
# caller's privilege in the caller's MPU context.
#
# Starts at 0x20, NOT 0: the kernel gives every task a no-access null region
# over 0x0..0x20 (sys/kern/build.rs), and PMSAv8 prohibits overlapping MPU
# regions (observed as a fault/retry loop that starves the system, not a
# clean error). The ROM's Arm header words at 0x10..0x18 are therefore
# unreachable from tasks; lib/rp235x-romapi uses the RISC-V well-known copies
# at 0x7df6+ (same table) and walks the ROM table itself.
[[rom]]
address = 0x0000_0020
size = 0x7fe0
read = true
execute = true

# The whole flash, read-only, through the *uncached XIP mirror*
# (XIP_NOCACHE_NOALLOC_BASE) -- lets the flash driver read any flash address.
# The mirror is used instead of XIP_BASE because the driver's own code region
# lives inside 0x10xxxxxx, and ARMv8-M PMSAv8 prohibits overlapping MPU
# regions (overlap is UNPREDICTABLE; observed as the task faulting at start).
[[xip]]
address = 0x1400_0000
size = 0x40_0000
read = true
