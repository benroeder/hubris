[package]
name = "drv-rp235x-ws2812"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { workspace = true }
idol-runtime = { workspace = true }
num-traits = { workspace = true }
zerocopy = { workspace = true }
zerocopy-derive = { workspace = true }
rp235x-pac = { workspace = true }

drv-rp235x-ws2812-api = { path = "../rp235x-ws2812-api" }
counters = { path = "../../lib/counters" }
userlib = { path = "../../sys/userlib" }

[features]
# SB Components MusicPi HAT: pixel on GP26, PIO0 SM1 + instr-mem 8..11 (SM0 +
# slots 0..7 belong to the I2S audio task). Default: GP22, SM0, slots 0..3.
musicpi = []

[build-dependencies]
idol = { workspace = true }

[[bin]]
name = "drv-rp235x-ws2812"
test = false
doctest = false
bench = false

[lints]
workspace = true
