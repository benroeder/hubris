[package]
name = "drv-rp235x-cyw43"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { workspace = true }
idol-runtime = { workspace = true }
num-traits = { workspace = true }
zerocopy = { workspace = true }
zerocopy-derive = { workspace = true }
rp235x-pac = { workspace = true }
smoltcp = { workspace = true, features = ["proto-ipv4", "socket-tcp", "socket-dhcpv4"] }

cyw43-portal = { path = "../../lib/cyw43-portal" }
drv-rp235x-cyw43-api = { path = "../rp235x-cyw43-api" }
drv-auxflash-api = { path = "../auxflash-api" }
counters = { path = "../../lib/counters" }
mutable-statics = { path = "../../lib/mutable-statics" }
userlib = { path = "../../sys/userlib" }

[build-dependencies]
idol = { workspace = true }

[[bin]]
name = "drv-rp235x-cyw43"
test = false
doctest = false
bench = false

[lints]
workspace = true
