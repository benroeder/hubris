[package]
name = "drv-rp235x-pwm"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { workspace = true }
idol-runtime = { workspace = true }
num-traits = { workspace = true }
zerocopy = { workspace = true }
zerocopy-derive = { workspace = true }
rp235x-pac = { workspace = true }

drv-rp235x-pwm-api = { path = "../rp235x-pwm-api" }
drv-rp235x-sys-api = { path = "../rp235x-sys-api" }
drv-rp235x-gpio-api = { path = "../rp235x-gpio-api", optional = true }
drv-rp235x-sdcard-api = { path = "../rp235x-sdcard-api", optional = true }
embedded-sdmmc = { workspace = true, optional = true }
counters = { path = "../../lib/counters" }
userlib = { path = "../../sys/userlib" }

[build-dependencies]
idol = { workspace = true }

[features]
# `sdcard` wires the streaming WAV player (`play_file`) to the SD block device
# via embedded-sdmmc. Without it, `play_file` compiles but returns OpenFailed.
sdcard = ["dep:drv-rp235x-sdcard-api", "dep:embedded-sdmmc", "dep:drv-rp235x-gpio-api"]

[[bin]]
name = "drv-rp235x-pwm"
test = false
doctest = false
bench = false

[lints]
workspace = true
